<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Mantenimiento COQUIVACOA C.A</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem;">
    <img src="Logo.jpg" alt="Logo Coquivacoa C.A." style="max-height: 70px; width: auto; object-fit: contain; background: white; padding: 4px; border-radius: 6px;">
    <h1>COQUIVACOA C.A.</h1>
    <p>Sistema de Gestión de Mantenimiento - Surtidores y Dispensadores</p>
  </header>

  <div class="container" style="max-width: 600px; margin-top: 2rem;">
    <div class="card" style="text-align: center; padding: 3rem 2rem;">
      <h2>Seleccione su Perfil de Acceso</h2>
      <p style="color: var(--pdvsa-gray); margin-bottom: 2rem;">Elija una opción para ingresar al sistema operativo.</p>
      
      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <button onclick="abrirModal('admin')" style="background: linear-gradient(135deg, #111827 0%, #374151 100%);">
          👑 1.- Administración
        </button>
        <button onclick="abrirModal('tecnico')">
          🔧 2.- Técnico
        </button>
        <!-- Tercer botón: Acceso directo al Mapa -->
        <button onclick="window.location.href='mapa.html'" style="background: linear-gradient(135deg, #0369A1 0%, #0284C7 100%);">
          🗺️ 3.- Mapa de Ubicaciones
        </button>
        <button onclick="cerrarApp()" style="background: #991B1B;">
          ❌ 4.- Cerrar Sistema
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Autenticación -->
  <div id="authModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); backdrop-filter: blur(4px); justify-content:center; align-items:center; z-index:1000;">
    <div class="card" style="width: 100%; max-width: 400px; margin: 1rem;">
      <h2 id="modalTitle">Autenticación</h2>
      <form id="formLogin">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label>Correo Electrónico</label>
          <input type="email" id="loginEmail" required placeholder="correo@coquivacoa.com">
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <div style="display: flex; gap: 1rem;">
          <button type="submit">Ingresar</button>
          <button type="button" onclick="cerrarModal()" style="background: #6B7280;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="password-toggle.js"></script>
  <script>
    let rolSeleccionado = '';

    function abrirModal(rol) {
      rolSeleccionado = rol;
      document.getElementById('modalTitle').textContent = rol === 'admin' ? 'Acceso Administrativo' : 'Acceso Técnico';
      document.getElementById('authModal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('authModal').style.display = 'none';
      document.getElementById('formLogin').reset();
    }

    function cerrarApp() {
      if(confirm('¿Desea cerrar el sistema?')) {
        window.close();
        alert('Puede cerrar esta pestaña del navegador.');
      }
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if(res.ok && data.success) {
          sessionStorage.setItem('userRole', data.role);
          sessionStorage.setItem('userId', data.id);
          sessionStorage.setItem('userName', data.name);
          window.location.href = `dashboard.html?role=${data.role}`;
        } else {
          alert(data.error || 'Credenciales inválidas');
        }
      } catch (err) {
        alert('Error de conexión con el servidor.');
      }
    });
  </script>
</body>
</html>
